<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pikachu | Pokémon</title>
    <link rel="stylesheet" href="pica.css" />
</head>
<body>

    <!-- NAVIGATION -->
    <header>
        <div class="logo-box">
            <img src="./pokemon-logo-01.png" 
                 alt="Pokemon Logo" class="logo">

            <!-- Underline added -->
            <div class="logo-line"></div>
        </div>

        <div class="menu">&#9776;</div>
    </header>

    <!-- SIDE DOTS -->
    <div class="side-dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>

    <!-- MAIN CONTENT -->
    <section class="container">

        <!-- LEFT PART -->
        <div class="left">
            <h4>POKEMON GEN I</h4>

            <h1>Pikachu</h1>

            <p>Pikachu is an Electric-type Pokémon introduced in Generation I. 
               Pikachu are small, chubby, and incredibly cute mouse-like Pokémon. 
               They are almost completely covered by yellow fur.</p>

            <div class="count">01 / 08</div>

            <div class="poke-circle"></div>
        </div>

        <!-- RIGHT PART -->
        <div class="right">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/25.png" 
                 alt="Pikachu" class="character">
        </div>

    </section>

</body>
</html>
